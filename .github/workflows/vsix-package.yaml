name: VsixPackage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - created

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn package
      - name: Publish
        if: success() && startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        run: yarn deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
