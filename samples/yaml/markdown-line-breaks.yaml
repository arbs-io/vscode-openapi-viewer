openapi: 3.0.4
info:
  title: Markdown line breaks
  version: 1.0.0
  description: |
    Toggle `openapi.preview.markdownLineBreaks` to compare rendering.
    With the setting off, this line joins the one above (CommonMark soft break).

    ```yaml
    code: blocks
    are: never altered
    ```
paths:
